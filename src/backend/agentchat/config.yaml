# 服务配置
server:
  env: "dev" # prod / test / dev
  host: "127.0.0.1"
  port: 7860
  name: "AgentChat" # 项目名称
  version: "2.5.0" # 服务版本号

# 数据库配置：MySQL (请根据实际配置更改 endpoint)
# 格式：mysql+pymysql://<user>:<password>@<host>:<port>/<database>
mysql:
  endpoint: "mysql+pymysql://root:123456@localhost:3306/agentchat" # 同步连接配置
  async_endpoint: "mysql+aiomysql://root:123456@localhost:3306/agentchat" # 异步连接配置

# 缓存配置：Redis
redis:
  endpoint: "redis://localhost:6379" # Redis 连接地址

# 多模型服务配置 (LLM、Embedding、Rerank)
multi_models:
  # 对话模型配置
  conversation_model:
    api_key: "sk-local-placeholder"  # 由 .env 的 DEEPSEEK_API_KEY 注入
    base_url: "https://api.deepseek.com/v1"
    model_name: "deepseek-v4-flash"
  # 工具调用/Function Call 模型配置
  tool_call_model:
    api_key: "sk-local-placeholder"  # 由 .env 注入
    base_url: "https://api.deepseek.com/v1"
    model_name: "deepseek-v4-flash"
  # 复杂推理模型配置
  reasoning_model:
    api_key: "sk-local-placeholder"
    base_url: "https://api.deepseek.com/v1"
    model_name: "deepseek-v4-pro"
  # 文生图模型配置
  text2image:
    api_key: "sk-local-placeholder"
    base_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis"
    model_name: "wanx2.0-t2i-turbo"
  # 多模态 (视觉) 模型配置
  qwen_vl:
    api_key: "sk-local-placeholder"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen-vl-plus"

  # Embedding 模型配置 (用于向量化)
  embedding:
    api_key: "local-embedding-key"  # 本地向量服务不校验Key
    base_url: "http://127.0.0.1:19000/v1"
    model_name: "BAAI/bge-small-zh-v1.5"

  # Rerank 模型配置 (用于重排序召回结果)
  rerank:
    api_key: "sk-local-placeholder"
    base_url: "https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank"
    model_name: "gte-rerank-v2"


# 外部工具 (Tool) 配置
tools: {} # 外部工具已裁剪，预留段位
rag:
  enable_summary: False # 是否对知识库片段进行摘要
  enable_keyword_recall: True # 混合检索：BM25 关键词 + 向量双路召回，RRF 融合
  rerank_mode: "local" # 重排模式: local（本地bge-reranker）/ dashscope（云端，需Key）/ off
  local_rerank_model: "BAAI/bge-reranker-base" # 本地重排模型（fastembed ONNX）

  retrival:
    top_k: 5  # 知识库召回的最大数量
    min_score: 0.2 # 知识库召回结果的最小相似度分数阈值

  split:
    chunk_size: 500 # 知识库文档分块的最大字符数
    overlap_size: 100 # 文档分块之间的重叠字符数

  # 向量数据库配置：统一使用 ChromaDB（本地持久化）
  vector_db:
    mode: "chroma"

# 文件存储配置：本地磁盘（经 /api/files 静态目录对外提供）
storage:
  mode: "local"
  local:
    root: "./storage_data"

# 默认配置 (如图标 URL, 资源链接)
default_config:
  mcp_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/mcp/mcp.png"
  tool_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/tools/default.png" # 工具默认图标 URL
  agent_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/tools/bot.png" # Agent 默认图标 URL
  mars_daily_url: "https://news.aibase.com/zh/news" # 外部新闻链接
  memory_collection_name: "memory" # 记忆存储的集合名称

# 扩展功能：微信配置 (不添加也可正常运行)
wechat_config:
  token: "LiangTian"
  app_id: "wxf768871******"
  secret: ""

# 追踪工具 Langfuse 配置 (目前版本可能未应用)
langfuse:
  trace_name: "agentchat"
  host: "https://cloud.langfuse.com"
  public_key: "pk-lf-q3e80e5f-da6d-40cb-8bc1-******" # Langfuse 公钥
  secret_key: "sk-lf-q3e80e5f-da6d-40cb-8bc1-******" # Langfuse 私钥
  user_id: "LiangTian" # 用户 ID

# 接口白名单路径
whitelist_paths: ["/mcp/*"]